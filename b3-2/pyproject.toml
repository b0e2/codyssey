[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-gitgen"
version = "0.1.0"
description = "Git 변경 사항을 기반으로 커밋 메시지와 PR 초안을 생성하는 CLI 도구"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0,<3.0.0",
    "PyYAML>=6.0.0,<7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
]

[project.scripts]
ai-gitgen = "ai_gitgen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
